<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentora — Discussion</title>
  <link rel="stylesheet" href="/static/brutalist.css">
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    .chat-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; height: calc(100vh - 140px); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 1rem 0; }
    .msg {
      margin-bottom: 1rem;
      max-width: 80%;
      padding: 1rem 1.25rem;
      font-size: 0.9rem;
      line-height: 1.5;
      border: 3px solid var(--ink);
    }
    .msg.teacher { background: white; box-shadow: 5px 5px 0 0 #000; align-self: flex-start; }
    .msg.student { background: var(--acid); align-self: flex-end; box-shadow: 5px 5px 0 0 #000; }
    .msg .role {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
      color: rgba(0,0,0,0.5);
    }
    .chat-input {
      display: flex;
      gap: 0.5rem;
      border-top: 3px solid var(--ink);
      padding: 1rem 0;
    }
    .chat-input input {
      flex: 1;
      padding: 1rem;
      font-size: 1rem;
      font-family: 'Archivo', sans-serif;
    }
    .chat-input button {
      padding: 1rem 2rem;
      background: var(--ink);
      color: var(--acid);
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.85rem;
      text-transform: uppercase;
      border: 3px solid var(--ink);
      box-shadow: 5px 5px 0 0 #000;
      cursor: pointer;
      transition: all 0.08s;
    }
    .chat-input button:hover { transform: translate(2px, 2px); box-shadow: 4px 4px 0 0 #000; }
    .chat-input button:active { transform: translate(5px, 5px); box-shadow: none; }
    .quick-chips { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .chip {
      border: 2px solid var(--ink);
      padding: 0.5rem 1rem;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      background: white;
      transition: all 0.08s;
    }
    .chip:hover { background: var(--acid); box-shadow: 3px 3px 0 0 #000; }
    .typing { display: flex; gap: 4px; padding: 0.5rem; }
    .typing span { width: 8px; height: 8px; background: var(--ink); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
  </style>
</head>
<body>
  <header>
    <nav>
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <a href="/dashboard" style="width:36px;height:36px;display:grid;place-items:center;background:var(--ink);color:var(--acid);font-family:'Archivo Black',sans-serif;font-size:1.1rem;border:3px solid var(--ink);box-shadow:5px 5px 0 0 #000;text-decoration:none;">M</a>
        <div style="font-family:'Archivo Black',sans-serif;font-size:1rem;text-transform:uppercase;letter-spacing:-0.025em;">
          Mentora <span style="color:rgba(0,0,0,0.3);margin:0 0.5rem;">/</span> <span style="color:rgba(0,0,0,0.6);">Discussion</span>
        </div>
      </div>
      <a href="/dashboard" style="background:var(--ink);color:var(--paper);font-family:'Archivo Black',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:0.02em;padding:0.625rem 1rem;border:3px solid var(--ink);box-shadow:5px 5px 0 0 #000;text-decoration:none;" class="btn-brutal">
        Back <span style="color:var(--acid);">→</span>
      </a>
    </nav>
  </header>

  <main style="flex:1;padding:1.5rem;overflow:hidden;">
    <div class="chat-container">
      <div class="chat-messages" id="chatMessages">
        <div class="msg teacher">
          <div class="role">Mentora</div>
          <div>Welcome! I'm your AI tutor. Ask me anything about your lessons, or I can quiz you on what you've learned.</div>
        </div>
      </div>

      <div class="quick-chips">
        <button class="chip" onclick="sendQuick('Explain Ohm's Law simply')">💡 Explain simply</button>
        <button class="chip" onclick="sendQuick('Give me a practice problem')">📝 Practice problem</button>
        <button class="chip" onclick="sendQuick('What are my weak areas?')">📊 My weak areas</button>
        <button class="chip" onclick="sendQuick('Quiz me on the last lesson')">✅ Quiz me</button>
      </div>

      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Ask Mentora anything..." onkeypress="if(event.key==='Enter')sendMsg()">
        <button onclick="sendMsg()">Send <iconify-icon icon="ph:paper-plane-right-bold" style="font-size:1rem;vertical-align:middle;"></iconify-icon></button>
      </div>
    </div>
  </main>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.innerHTML = '<div class="role">' + (role === 'teacher' ? 'Mentora' : 'You') + '</div><div>' + text + '</div>';
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'msg teacher';
      div.id = 'typing-indicator';
      div.innerHTML = '<div class="role">Mentora</div><div class="typing"><span></span><span></span><span></span></div>';
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function sendMsg() {
      const text = chatInput.value.trim();
      if (!text) return;
      addMessage('student', text);
      chatInput.value = '';
      simulateReply(text);
    }

    function sendQuick(text) {
      addMessage('student', text);
      simulateReply(text);
    }

    async function simulateReply(question) {
      showTyping();
      try {
        const res = await fetch('/api/discuss', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: question })
        });
        removeTyping();
        if (res.ok) {
          const data = await res.json();
          addMessage('teacher', data.answer || 'Sorry, I could not answer that. Try asking about your recent lessons or weak areas.');
        } else {
          addMessage('teacher', 'Sorry, I encountered an error. Please try again.');
        }
      } catch(e) {
        removeTyping();
        addMessage('teacher', 'Connection error. Make sure the Mentora server is running.');
      }
    }
  </script>
</body>
</html>

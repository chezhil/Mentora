<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentora — Voice</title>
  <link rel="stylesheet" href="/static/brutalist.css">
  <style>
    .wrap { max-width: 1080px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
    .grid { display: grid; grid-template-columns: 360px 1fr; gap: 1.5rem; align-items: start; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    .panel { border: 3px solid var(--ink); background: #fff;
             box-shadow: 8px 8px 0 0 #000; padding: 1.25rem; }
    .label { font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700;
             text-transform: uppercase; letter-spacing: 0.12em; color: rgba(0,0,0,0.45); }
    #stage { background: var(--paper); border-bottom: 3px solid var(--ink); position: relative; }
    #avatar { width: 100%; display: block; }
    #avatar[data-variant="f"] .v-m, #avatar[data-variant="m"] .v-f { display: none; }
    #state { position: absolute; left: 0; right: 0; bottom: 0; padding: 0.5rem 0.75rem;
             background: var(--ink); color: var(--acid);
             font-family: 'Archivo Black', sans-serif; font-size: 0.7rem;
             text-transform: uppercase; letter-spacing: 0.1em; text-align: center; }
    .btn { font-family: 'Archivo Black', sans-serif; text-transform: uppercase;
           border: 3px solid var(--ink); padding: 0.9rem 1.2rem; font-size: 0.85rem;
           background: #fff; color: var(--ink); box-shadow: 5px 5px 0 0 #000;
           cursor: pointer; text-decoration: none; display: inline-block; }
    .btn.talk { background: var(--acid); width: 100%; font-size: 1rem; padding: 1.1rem; }
    .btn.talk.live { background: var(--ink); color: var(--acid); }
    .btn[disabled] { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
    .row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    #log { max-height: 46vh; overflow-y: auto; }
    .turn { border: 3px solid var(--ink); padding: 0.8rem 1rem; margin-bottom: 0.7rem; }
    .turn.student { background: var(--acid); margin-left: 2rem; }
    .turn.teacher { background: #fff; }
    .turn p { line-height: 1.55; margin-top: 0.3rem; white-space: pre-wrap; }
    #boardImg img { width: 100%; display: block; border: 3px solid var(--ink); }
    .hint { font-size: 0.8rem; color: rgba(0,0,0,0.55); line-height: 1.5; }
  </style>
</head>
<body>
  <header style="border-bottom:3px solid var(--ink);padding:0.9rem 1.25rem;background:var(--paper);">
    <nav style="display:flex;align-items:center;gap:0.75rem;max-width:1080px;margin:0 auto;">
      <a href="/dashboard" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:0.75rem;">
        <div style="width:36px;height:36px;display:grid;place-items:center;background:var(--ink);color:var(--acid);font-family:'Archivo Black',sans-serif;font-size:1.1rem;border:3px solid var(--ink);box-shadow:5px 5px 0 0 #000;">M</div>
        <div style="font-family:'Archivo Black',sans-serif;font-size:1rem;text-transform:uppercase;">Mentora</div>
      </a>
      <div class="label">/ Voice</div>
    </nav>
  </header>

  <main class="grid-bg" style="flex:1;">
    <div class="wrap">
      <div class="grid">
        <div>
          <div class="panel" style="padding:0;overflow:hidden;">
            <div id="stage">
      <svg id="avatar" viewBox="0 0 400 460" aria-label="avatar" data-variant="f">
      <defs>
      <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8f9c" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff8f9c" stop-opacity="0"/>
      </radialGradient>
      </defs>

      <!-- Two variants share ONE rig. Only the silhouette parts carry a
      .v-f / .v-m class; every id the driver touches — brows, eyes, mouth,
      head, features — is common to both, so switching character costs
      character.js and driver.js nothing at all. That is the same property
      that makes swapping in a Live2D model cheap. -->
      <g id="root">
      <!-- Neck first, shirt over it, head over both: that ordering is what
      keeps the join hidden however far the head turns. -->
      <g id="body">
      <path class="v-f" d="M174 286 l52 0 l0 82 q-26 14 -52 0 z"
      fill="#e8bf9c"/>
      <path class="v-m" d="M170 286 l60 0 l0 86 q-30 14 -60 0 z"
      fill="#e3b795"/>
      <!-- The shirt runs PAST the bottom of the 460-tall view and wider
      than the shoulders need. It used to stop exactly on y=460, so
      the moment the body drifted upward the frame edge appeared
      underneath it and the teacher looked like a sticker peeling
      off the board. Everything below the view is clipped, so the
      overhang costs nothing and no amount of movement can open a
      gap. The collar sits higher for the same reason: it has to
      stay over the neck join however far the head turns. -->
      <path class="v-f" d="M80 520 q14 -184 120 -184 q106 0 120 184 z"
      fill="#4A7DFF"/>
      <path class="v-m" d="M72 520 q16 -180 128 -180 q112 0 128 180 z"
      fill="#2f6f5e"/>
      </g>

      <g id="hairBack">
      <path class="v-f"
      d="M200 44 q104 0 108 122 q4 92 -14 150 q-30 -104 -94 -104
      q-64 0 -94 104 q-18 -58 -14 -150 q4 -122 108 -122 z"
      fill="#241d33"/>
      <path class="v-m"
      d="M200 52 q92 0 94 112 q2 34 -6 58 q-16 -40 -88 -40
      q-72 0 -88 40 q-8 -24 -6 -58 q2 -112 94 -112 z"
      fill="#1f1a14"/>
      </g>

      <g id="head">
      <!-- ears -->
      <ellipse cx="112" cy="214" rx="13" ry="20" fill="#f0c9a8"/>
      <ellipse cx="288" cy="214" rx="13" ry="20" fill="#f0c9a8"/>
      <!-- face: the jaw is the cue, so it is per-variant -->
      <path class="v-f"
      d="M200 96 q84 0 84 100 q0 58 -25 94 q-24 34 -59 34
      q-35 0 -59 -34 q-25 -36 -25 -94 q0 -100 84 -100 z"
      fill="#f7d9bd"/>
      <path class="v-m"
      d="M200 96 q86 0 86 102 q0 60 -18 94 q-20 36 -68 36
      q-48 0 -68 -36 q-18 -34 -18 -94 q0 -102 86 -102 z"
      fill="#efc9a4"/>

      <g id="features">
      <g id="blush" opacity="0">
      <ellipse cx="146" cy="248" rx="26" ry="15" fill="url(#cheek)"/>
      <ellipse cx="254" cy="248" rx="26" ry="15" fill="url(#cheek)"/>
      </g>

      <g id="brows">
      <path class="v-f" d="M136 190 q22 -11 44 -2" stroke="#241d33"
      stroke-width="7" fill="none" stroke-linecap="round"/>
      <path class="v-f" d="M220 188 q22 -9 44 2" stroke="#241d33"
      stroke-width="7" fill="none" stroke-linecap="round"/>
      <path class="v-m" d="M134 199 q23 -7 45 -1" stroke="#1f1a14"
      stroke-width="8" fill="none" stroke-linecap="round"/>
      <path class="v-m" d="M221 198 q23 -6 45 1" stroke="#1f1a14"
      stroke-width="8" fill="none" stroke-linecap="round"/>
      </g>

      <g id="eyeL" class="eye">
      <ellipse cx="158" cy="222" rx="25" ry="21" fill="#fff"/>
      <g id="irisL">
      <circle cx="158" cy="223" r="14" fill="#3a7bd5"/>
      <circle cx="158" cy="223" r="7" fill="#151226"/>
      <circle cx="153" cy="217" r="4.5" fill="#fff" opacity=".9"/>
      </g>
      <path class="lash" d="M133 214 q25 -20 50 -2" stroke="#241d33"
      stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>

      <g id="eyeR" class="eye">
      <ellipse cx="242" cy="222" rx="25" ry="21" fill="#fff"/>
      <g id="irisR">
      <circle cx="242" cy="223" r="14" fill="#3a7bd5"/>
      <circle cx="242" cy="223" r="7" fill="#151226"/>
      <circle cx="237" cy="217" r="4.5" fill="#fff" opacity=".9"/>
      </g>
      <path class="lash" d="M217 212 q25 -18 50 2" stroke="#241d33"
      stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>

      <!-- nose -->
      <path d="M200 246 q6 10 -2 14" stroke="#d9a882" stroke-width="4"
      fill="none" stroke-linecap="round"/>

      <!-- The mouth is two ellipses: the cavity, and a tongue hint so an
      open mouth has depth instead of reading as a hole. rx comes
      from mouthForm (round vs wide), ry from mouthOpen. -->
      <g id="mouth">
      <ellipse id="mouthCavity" cx="200" cy="292" rx="22" ry="3"
      fill="#7d2740"/>
      <ellipse id="mouthTongue" cx="200" cy="299" rx="14" ry="0"
      fill="#e3697f"/>
      <path id="mouthLine" d="M178 291 q22 6 44 0" stroke="#c98d76"
      stroke-width="3" fill="none" stroke-linecap="round"
      opacity=".8"/>
      </g>
      </g>
      </g>

      <g id="hairFront">
      <path class="v-f"
      d="M104 178 q6 -110 96 -110 q90 0 96 110 q-24 -58 -50 -62
      q10 34 -12 48 q-16 -46 -60 -44 q-46 2 -70 58 z"
      fill="#2e2542"/>
      <path class="v-f" d="M262 86 q34 16 34 60 l-12 -6 q-4 -34 -30 -44 z"
      fill="#FFD400"/>
      <path class="v-m"
      d="M106 186 q2 -114 94 -114 q92 0 94 114 q-12 -32 -34 -48
      q-32 30 -84 18 q-40 -12 -62 30 z"
      fill="#241d18"/>
      </g>
      </g>
      </svg>
              <div id="state">Ready</div>
            </div>
          </div>

          <div class="panel" style="margin-top:1.25rem;">
            <button class="btn talk" id="talk">Start talking</button>
            <div class="row" style="margin-top:0.7rem;">
              <button class="btn" id="stop" style="flex:1;" disabled>Stop</button>
              <button class="btn" id="mute" style="flex:1;">Mute</button>
            </div>
            <p class="hint" style="margin-top:0.9rem;" id="hint">
              Press Start, ask out loud, then pause. She answers aloud and
              everything is written down beside her.
            </p>
          </div>

          <div class="panel" id="board" style="margin-top:1.25rem;display:none;">
            <div class="label" id="boardCap">On the board</div>
            <div style="margin-top:0.6rem;" id="boardImg"></div>
          </div>
        </div>

        <div>
          <div class="panel">
            <div class="label">Transcript</div>
            <div id="log" style="margin-top:0.8rem;">
              <p class="hint" id="empty">Nothing said yet.</p>
            </div>
            <div class="row" style="margin-top:1rem;">
              <input type="text" id="typed" placeholder="&#8230;or type instead"
                     style="flex:1;min-width:180px;border:3px solid var(--ink);padding:0.75rem 0.9rem;font-family:inherit;font-size:0.95rem;">
              <button class="btn" id="send">Send</button>
            </div>
            <div class="row" style="margin-top:0.8rem;">
              <button class="btn" id="save" style="font-size:0.72rem;">Save to chat</button>
              <a class="btn" href="/discuss" style="font-size:0.72rem;">Open chat</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/ask-rail.js"></script>
  <script src="/static/voice.js"></script>
</body>
</html>

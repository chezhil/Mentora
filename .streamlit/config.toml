# Streamlit theme.
#
# This sets the base colours; ui/style.css does the rest (keylines, hard
# shadows, square corners — see the notes at the top of that file). The two
# have to agree: Streamlit paints some chrome before any CSS loads, and a dark
# base flashing behind a light page on every rerun is very visible on a
# recording.
#
# Full reference: https://docs.streamlit.io/develop/api-reference/configuration/config.toml

[theme]
base = "light"

# Yellow is the accent throughout — buttons, the progress fill, the selected
# tab, the score. It is the same yellow the rendered visuals use, so a diagram
# on screen belongs to the page around it.
primaryColor = "#FFD400"

# Warm off-white rather than pure white: white blooms under video compression
# and is harsh next to a black keyline.
backgroundColor = "#F5F1E8"
secondaryBackgroundColor = "#FFFFFF"

textColor = "#12100E"

font = "sans serif"

[server]
# Keeps the demo tidy — no upload size surprises mid-recording.
maxUploadSize = 200

[browser]
gatherUsageStats = false

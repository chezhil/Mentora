<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENTORA - ACTIVE LESSON</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button id="hamburger-btn" class="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
                <div class="logo">MENTORA</div>
            </div>
            <div class="header-right">
                <div class="user-profile">USR // NAMAN</div>
                <button id="theme-toggle" class="theme-btn">DARK</button>
            </div>
        </header>

        <div class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar">
                <nav class="nav-menu">
                    <div class="nav-header">SYSTEM MODULES</div>
                    <a href="index.html" class="nav-btn ">SETUP LESSON</a>
                    <a href="lesson.html" class="nav-btn active">ACTIVE LESSON</a>
                    <a href="quiz.html" class="nav-btn ">FINAL QUIZ</a>
                    <a href="progress.html" class="nav-btn ">PROGRESS & ANALYTICS</a>
                    <a href="report.html" class="nav-btn ">LESSON REPORT</a>
                </nav>
            </aside>

            <!-- Main Features Area -->
            <main class="content-area">

                <div class="panel chat-interface">
                    <div class="lesson-layout">
                        <div class="video-container">
                            <canvas id="avatar-canvas" style="width: 100%; height: 100%; display: block;"></canvas>
                            <div class="visual-placeholder" id="visual-viewer">DIAGRAM / EQUATION VIEWER</div>
                        </div>
                        <div class="chat-history" id="chat-history">
                            <div class="message system">
                                <strong>SYS</strong> CONNECTING TO AVATAR STREAM...
                            </div>
                        </div>
                    </div>

                    <div class="input-area">
                        <button id="ptt-btn" class="brutal-btn action-btn" style="background-color: var(--accent-3); padding: 0 15px; margin-right: 10px;">🎤 PTT</button>
                        <textarea id="prompt-input" placeholder="ASK A FOLLOW-UP QUESTION..."></textarea>
                        <button id="send-btn" class="action-btn">SEND</button>
                    </div>
                </div>
        
            </main>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="AITutorAvatar.js"></script>
    <script src="script.js"></script>
</body>
</html>
